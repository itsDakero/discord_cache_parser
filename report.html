<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Discord · Recovered conversations</title>
<style>
:root { color-scheme: dark; font: 16px/1.45 "Segoe UI", Arial, sans-serif; color: #dbdee1; background: #313338; }
* { box-sizing: border-box; }
body { margin: 0; }
a { color: #00a8fc; text-decoration: none; }
a:hover { text-decoration: underline; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: 260px; background: #2b2d31; overflow: auto; padding: 20px 12px; border-left: 10px solid #1e1f22; }
h1 { color: #f2f3f5; font-size: 18px; margin: 0 0 4px; }
.subtitle, .notice { color: #b5bac1; font-size: 13px; }
.sidebar h2 { text-transform: uppercase; font-size: 12px; color: #b5bac1; margin-top: 28px; letter-spacing: .05em; }
nav a { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 9px; border-radius: 4px; color: #b5bac1; overflow-wrap: anywhere; }
nav a:hover, nav a:focus { background: #404249; color: white; text-decoration: none; }
nav small { color: #b5bac1; }
.evidence { display: block; margin: 24px 8px; }
main { margin-left: 260px; }
.channel { display: none; padding-bottom: 40px; }
.channel:first-of-type { display: block; }
main:has(.channel:target) .channel { display: none; }
main:has(.channel:target) .channel:target { display: block; }
.channel > h2 { position: sticky; top: 0; margin: 0; padding: 14px 24px; background: #313338; border-bottom: 1px solid #232428; font-size: 16px; color: #f2f3f5; z-index: 1; overflow-wrap: anywhere; }
.notice { padding: 8px 24px; }
.day { display: flex; align-items: center; gap: 12px; margin: 24px 16px; color: #b5bac1; font-size: 12px; font-weight: 600; }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: #4e5058; }
.message { position: relative; padding: 4px 24px 4px 76px; margin-top: 16px; overflow-wrap: anywhere; }
.message:hover { background: #2e3035; }
.message header strong { color: #f2f3f5; font-size: 16px; font-weight: 600; }
time, .edited { color: #b5bac1; font-size: 12px; }
time { margin-left: 6px; }
.avatar { position: absolute; top: 6px; left: 20px; width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
.fallback { display: grid; place-items: center; background: #5865f2; color: white; font-weight: 600; }
.content { white-space: pre-wrap; }
.content pre { white-space: pre-wrap; padding: 12px; background: #2b2d31; border: 1px solid #1e1f22; border-radius: 4px; }
code { background: #2b2d31; border-radius: 3px; font-family: Consolas, monospace; font-size: .9em; padding: 2px; }
.mention { color: #c9cdfb; background: #5865f24d; border-radius: 3px; padding: 0 2px; }
.grouped { margin-top: 0; }
.compact-time { position: absolute; left: 20px; top: 7px; color: #b5bac1; font-size: 10px; }
.attachment { margin-top: 8px; }
.image { display: block; max-width: min(520px, 100%); max-height: 360px; border-radius: 8px; object-fit: contain; }
.file { display: block; padding: 8px 12px; margin-top: 4px; border: 1px solid #232428; border-radius: 4px; background: #2b2d31; width: fit-content; max-width: 100%; }
.missing, .system-type { color: #b5bac1; font-size: 13px; }
.system-type { display: block; }
.metadata { font-size: 11px; color: #b5bac1; margin-top: 4px; }
.metadata summary { cursor: pointer; width: fit-content; }
.metadata pre { white-space: pre-wrap; }
@media (max-width: 700px) {
.sidebar { position: static; width: auto; max-height: 240px; border-left: 0; padding: 12px; }
.sidebar h2 { margin-top: 12px; }
.evidence { margin: 12px 8px; }
main { margin-left: 0; }
.message { padding-right: 12px; }
}
@media print {
.sidebar { display: none; }
main { margin: 0; }
main .channel, main:has(.channel:target) .channel { display: block; }
.channel > h2 { position: static; }
}
</style>
</head>
<body>
<aside class="sidebar">
<h1>Recovered conversations</h1>
<div class="subtitle">Discord cache report</div>

</body>
</html>
